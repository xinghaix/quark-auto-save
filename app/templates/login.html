<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="./static/css/bootstrap.min.css">
    <link rel="stylesheet" href="./static/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./static/css/theme.css">
    <script src="./static/js/i18n.js"></script>
    <script>
        (function () {
            var theme = localStorage.getItem('qas.theme') || 'light';
            var lang = localStorage.getItem('qas.lang') || 'zh';
            document.documentElement.setAttribute('data-theme', theme);
            window.QAS_applyHtmlLang(lang);
        })();
    </script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background:
                radial-gradient(1200px 400px at 10% -10%, color-mix(in srgb, var(--primary) 22%, transparent), transparent),
                var(--bg);
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            border-radius: 20px;
            overflow: hidden;
        }
        .login-header { padding: 1.6rem 2rem 0.4rem; text-align: center; }
        .login-body { padding: 1.4rem 2rem 2rem; }
        .login-tools { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 1rem; }
        .login-tools select {
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 4px 8px;
        }
        .btn-login { width: 100%; border-radius: 12px; padding: 10px 20px; }
    </style>
</head>

<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="mb-2" id="t-title">登录</h1>
                <p class="text-muted" id="t-welcome">欢迎回来，请登录您的账户</p>
            </div>
            <div class="login-body">
                <div class="login-tools">
                    <select id="theme" aria-label="theme">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="ocean">Ocean</option>
                        <option value="sunset">Sunset</option>
                    </select>
                    <select id="lang" aria-label="language">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>
                </div>
                {% if message %}
                <div class="alert alert-danger text-center" role="alert" id="login-error">[[ message ]]</div>
                {% endif %}
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label" id="t-user">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label" id="t-pass">密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login" id="t-btn">登录</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var langSel = document.getElementById('lang');
            var themeSel = document.getElementById('theme');
            langSel.value = localStorage.getItem('qas.lang') || 'zh';
            themeSel.value = localStorage.getItem('qas.theme') || 'light';
            function apply() {
                var lang = langSel.value;
                localStorage.setItem('qas.lang', lang);
                localStorage.setItem('qas.theme', themeSel.value);
                document.documentElement.setAttribute('data-theme', themeSel.value);
                window.QAS_applyHtmlLang(lang);
                document.title = QAS_t(lang, 'loginTitle');
                document.getElementById('t-title').textContent = QAS_t(lang, 'loginTitle');
                document.getElementById('t-welcome').textContent = QAS_t(lang, 'loginWelcome');
                document.getElementById('t-user').textContent = QAS_t(lang, 'username');
                document.getElementById('t-pass').textContent = QAS_t(lang, 'password');
                document.getElementById('t-btn').textContent = QAS_t(lang, 'loginBtn');
                var err = document.getElementById('login-error');
                if (err) err.textContent = QAS_t(lang, 'loginFailed');
            }
            langSel.addEventListener('change', apply);
            themeSel.addEventListener('change', apply);
            apply();
        })();
    </script>
</body>

</html>
