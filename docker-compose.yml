name: quark-auto-save

services:
  quark-auto-save:
    image: ghcr.io/xinghaix/quark-auto-save:latest
    container_name: quark-auto-save
    ports:
      - "5005:5005"
    restart: unless-stopped
    environment:
      WEBUI_USERNAME: "${WEBUI_USERNAME:-admin}"
      WEBUI_PASSWORD: "${WEBUI_PASSWORD:?set WEBUI_PASSWORD before starting}"
      TZ: "${TZ:-Asia/Shanghai}"
      # Optional: disable selected Python compatibility plugins.
      # PLUGIN_FLAGS: "-emby,-aria2"
    volumes:
      - ./config:/app/config
      - ./media:/media
